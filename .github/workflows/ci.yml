name: CI - Java2CSharp

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilação e Testes
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Testa o código em dois compiladores diferentes (conceito de Matrix)
        compiler: [g++, clang++] 

    steps:
      - uses: actions/checkout@v7

      - name: Instalar Dependências (Flex, Bison, CMake, Valgrind, Gcovr)
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison cmake valgrind gcovr ${{ matrix.compiler == 'clang++' && 'clang' || '' }}

      - name: Compilar Projeto
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          mkdir build && cd build
          cmake ..
          make -j$(nproc)

      - name: Executar Testes (CTest)
        id: ctest
        working-directory: build
        run: ctest --output-on-failure -V

      - name: Auditoria de Memória (Valgrind)
        working-directory: build
        run: |
          echo "Verificando fugas de memória dinâmicas nos nós da AST..."
          for test_file in ../tests/input/success/*.java; do
            valgrind --error-exitcode=1 --leak-check=full ./java2csharp "$test_file"
          done

      - name: Gerar Relatório de Cobertura (HTML)
        # Usa o comando que já definiu no CMakeLists.txt
        if: matrix.compiler == 'g++'
        working-directory: build
        run: make coverage_html

      - name: Subir Artefacto de Cobertura
        if: always() && matrix.compiler == 'g++'
        uses: actions/upload-artifact@v7
        with:
          name: gcovr-coverage-report
          path: build/coverage_report/
          if-no-files-found: warn

      - name: Resumo da Execução no GitHub
        if: always()
        run: |
          {
            echo "## Resumo da Compilação (${{ matrix.compiler }})"
            echo "| Etapa | Resultado |"
            echo "| --- | --- |"
            echo "| Build | ✅ Passou |"
            echo "| CTest | ${{ steps.ctest.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"