site_name: Java2CSharp
site_description: Transpilador de Java (Procedural) para C# — Compiladores 1
site_author: Luis, Mateus, Marco, Tomas

theme:
  name: material
  language: pt
  icon:
    logo: material/code-braces
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables

nav:
  - Visão Geral: index.md
  - Arquitetura & AST: arquitetura.md
  - Gramática & Tokens: gramatica.md
  - Guia de Compilação: guia-de-uso.md
  - Análise Semântica: analise-semantica.md
  - Roadmap: roadmap.md